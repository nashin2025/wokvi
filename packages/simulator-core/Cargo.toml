[package]
name = "wokvi-simulator-core"
version = "0.1.0"
edition = "2021"
description = "Multi-architecture microcontroller simulator core compiled to WASM"
license = "MIT"
repository = "https://github.com/wokvi/wokvi"

[lib]
crate-type = ["cdylib", "rlib"]
name = "wokvi_simulator_core"
path = "src/lib.rs"

[dependencies]
# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
console_log = "0.2"

# Microcontroller HALs (for native compilation)
# avr-hal = { version = "0.4", features = ["atmega328p"] }
# esp-hal = { version = "0.16", features = ["esp32", "binstart"] }
# rp2040-hal = "0.7"
# stm32f4xx-hal = "0.15"

# Simulation utilities
fixedbitset = "0.4"
rand = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[features]
default = ["avr", "esp32", "rp2040"]
avr = []
esp32 = []
rp2040 = []
stm32 = []