[package]
name = "wokvi-simulator-core"
version = "0.1.0"
edition = "2021"
description = "Multi-architecture microcontroller simulator core compiled to WASM"
license = "MIT"
repository = "https://github.com/wokvi/wokvi"

[lib]
crate-type = ["cdylib", "rlib"]
name = "wokvi_simulator_core"
path = "src/lib.rs"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
log = "0.4"
console_log = "0.2"
console_error_panic_hook = { version = "0.1", optional = true }
fixedbitset = "0.4"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[features]
default = ["console_error_panic_hook"]